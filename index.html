<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZM Fashion | Moda & Estilo</title>

    <meta
        name="description"
        content="ZM Fashion - Moda feminina para deixar seu estilo ainda mais especial."
    >

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f9fc;
            color: #172033;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button {
            font-family: inherit;
        }

        :root {
            --azul: #071a3d;
            --azul2: #0d2d63;
            --azul3: #17458f;
            --claro: #f8f9fc;
            --branco: #ffffff;
            --texto: #172033;
            --cinza: #687386;
            --borda: #e6eaf1;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--borda);
        }

        .header-container {
            max-width: 1200px;
            margin: auto;
            height: 76px;
            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--azul);
            letter-spacing: -1px;
        }

        .logo span {
            color: var(--azul3);
        }

        nav {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        nav a {
            font-size: 14px;
            font-weight: 600;
            color: #344054;
            transition: .3s;
        }

        nav a:hover {
            color: var(--azul3);
        }

        .menu-btn {
            display: none;
            border: 0;
            background: transparent;
            font-size: 28px;
            cursor: pointer;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 650px;
            background:
                linear-gradient(
                    90deg,
                    rgba(7,26,61,.97) 0%,
                    rgba(7,26,61,.90) 48%,
                    rgba(7,26,61,.25) 100%
                ),
                url("https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1800&q=85")
                center/cover;

            display: flex;
            align-items: center;
        }

        .hero-container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 70px 20px;
        }

        .hero-content {
            max-width: 600px;
            color: white;
        }

        .hero-tag {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 15px;

            border: 1px solid rgba(255,255,255,.3);
            border-radius: 30px;

            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .hero h1 {
            font-size: clamp(46px, 7vw, 82px);
            line-height: .95;
            letter-spacing: -3px;
            margin-bottom: 28px;
        }

        .hero h1 span {
            color: #9ec5ff;
        }

        .hero p {
            max-width: 520px;
            font-size: 18px;
            line-height: 1.7;
            color: rgba(255,255,255,.82);
            margin-bottom: 35px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            padding: 15px 25px;

            border-radius: 8px;

            background: white;
            color: var(--azul);

            font-size: 14px;
            font-weight: 800;

            transition: .3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,.2);
        }

        /* =========================
           BENEFÍCIOS
        ========================= */

        .benefits {
            background: white;
            border-bottom: 1px solid var(--borda);
        }

        .benefits-container {
            max-width: 1200px;
            margin: auto;
            padding: 25px 20px;

            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
        }

        .benefit {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .benefit-icon {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #edf3ff;

            color: var(--azul3);
            font-size: 20px;
        }

        .benefit strong {
            display: block;
            margin-bottom: 3px;
            font-size: 14px;
        }

        .benefit span {
            font-size: 12px;
            color: var(--cinza);
        }

        /* =========================
           SEÇÕES
        ========================= */

        .section {
            padding: 90px 20px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-header span {
            color: var(--azul3);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .section-header h2 {
            margin-top: 10px;
            font-size: 38px;
            color: var(--azul);
        }

        .section-header p {
            max-width: 600px;
            margin: 15px auto 0;
            color: var(--cinza);
            line-height: 1.7;
        }

        /* =========================
           CATEGORIAS
        ========================= */

        .categories {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
        }

        .category {
            position: relative;
            height: 340px;
            overflow: hidden;
            border-radius: 14px;
            cursor: pointer;
        }

        .category img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .5s;
        }

        .category:hover img {
            transform: scale(1.07);
        }

        .category::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(
                    transparent 35%,
                    rgba(0,0,0,.75)
                );
        }

        .category-info {
            position: absolute;
            z-index: 2;
            left: 25px;
            bottom: 25px;
            color: white;
        }

        .category-info h3 {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .category-info span {
            font-size: 13px;
            opacity: .85;
        }

        /* =========================
           PRODUTOS
        ========================= */

        .products {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 22px;
        }

        .product {
            background: white;
            border: 1px solid var(--borda);
            border-radius: 14px;
            overflow: hidden;
            transition: .3s;
        }

        .product:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 40px rgba(20,40,80,.1);
        }

        .product-image {
            position: relative;
            height: 330px;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .5s;
        }

        .product:hover .product-image img {
            transform: scale(1.05);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            left: 15px;

            padding: 7px 11px;

            border-radius: 20px;

            background: var(--azul);
            color: white;

            font-size: 10px;
            font-weight: 800;
        }

        .product-info {
            padding: 20px;
        }

        .product-info h3 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .product-description {
            font-size: 13px;
            line-height: 1.5;
            color: var(--cinza);
            min-height: 40px;
        }

        .product-bottom {
            margin-top: 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price {
            font-size: 19px;
            font-weight: 800;
            color: var(--azul);
        }

        .buy-btn {
            border: 0;
            background: var(--azul);
            color: white;

            padding: 10px 14px;
            border-radius: 7px;

            font-size: 12px;
            font-weight: 700;

            cursor: pointer;
            transition: .3s;
        }

        .buy-btn:hover {
            background: var(--azul3);
        }

        /* =========================
           BANNER
        ========================= */

        .banner {
            margin: 0 20px;
            border-radius: 18px;
            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(7,26,61,.96),
                    rgba(7,26,61,.45)
                ),
                url("https://images.unsplash.com/photo-1490481651871-ab68de25d43d?auto=format&fit=crop&w=1800&q=85")
                center/cover;
        }

        .banner-container {
            max-width: 1200px;
            margin: auto;
            padding: 80px 50px;
            color: white;
        }

        .banner h2 {
            max-width: 550px;
            font-size: 45px;
            line-height: 1.05;
            margin-bottom: 18px;
        }

        .banner p {
            max-width: 500px;
            line-height: 1.7;
            color: rgba(255,255,255,.8);
            margin-bottom: 25px;
        }

        /* =========================
           SOBRE
        ========================= */

        .about {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 70px;
            align-items: center;
        }

        .about-image {
            height: 550px;
            border-radius: 18px;
            overflow: hidden;
        }

        .about-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .about-content span {
            color: var(--azul3);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .about-content h2 {
            margin: 15px 0 20px;
            font-size: 42px;
            line-height: 1.1;
            color: var(--azul);
        }

        .about-content p {
            color: var(--cinza);
            line-height: 1.8;
            margin-bottom: 18px;
        }

        .about-list {
            margin-top: 25px;
            display: grid;
            gap: 12px;
        }

        .about-list div {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .about-list div::before {
            content: "✓";

            width: 24px;
            height: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #edf3ff;
            color: var(--azul3);

            font-weight: 900;
        }

        /* =========================
           DEPOIMENTOS
        ========================= */

        .testimonials {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 20px;
        }

        .testimonial {
            background: white;
            border: 1px solid var(--borda);
            border-radius: 14px;
            padding: 28px;
        }

        .stars {
            color: #f2b01e;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .testimonial p {
            color: #566174;
            line-height: 1.7;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .testimonial-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #edf3ff;
            color: var(--azul3);

            font-weight: 800;
        }

        .testimonial-user strong {
            display: block;
            font-size: 14px;
        }

        .testimonial-user span {
            color: var(--cinza);
            font-size: 11px;
        }

        /* =========================
           INSTAGRAM
        ========================= */

        .instagram-grid {
            display: grid;
            grid-template-columns: repeat(5,1fr);
            gap: 8px;
        }

        .instagram-grid a {
            height: 220px;
            overflow: hidden;
        }

        .instagram-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: .5s;
        }

        .instagram-grid a:hover img {
            transform: scale(1.08);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: var(--azul);
            color: white;
            margin-top: 80px;
        }

        .footer-container {
            max-width: 1200px;
            margin: auto;
            padding: 65px 20px 30px;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.3fr;
            gap: 50px;
        }

        .footer-logo {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .footer-logo span {
            color: #9ec5ff;
        }

        .footer-description {
            max-width: 350px;
            color: rgba(255,255,255,.65);
            line-height: 1.7;
            font-size: 13px;
        }

        .footer-column h4 {
            font-size: 14px;
            margin-bottom: 18px;
        }

        .footer-column a {
            display: block;
            margin-bottom: 12px;
            color: rgba(255,255,255,.65);
            font-size: 13px;
            transition: .3s;
        }

        .footer-column a:hover {
            color: white;
        }

        .footer-bottom {
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,.12);

            display: flex;
            justify-content: space-between;
            gap: 20px;

            color: rgba(255,255,255,.5);
            font-size: 12px;
        }

        /* =========================
           WHATSAPP
        ========================= */

        .whatsapp {
            position: fixed;
            right: 22px;
            bottom: 22px;

            width: 58px;
            height: 58px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #25d366;
            color: white;

            font-size: 28px;

            box-shadow: 0 8px 25px rgba(0,0,0,.2);

            z-index: 999;

            transition: .3s;
        }

        .whatsapp:hover {
            transform: scale(1.08);
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media(max-width: 900px) {

            nav {
                display: none;
            }

            .menu-btn {
                display: block;
            }

            .benefits-container {
                grid-template-columns: repeat(2,1fr);
            }

            .categories {
                grid-template-columns: repeat(2,1fr);
            }

            .products {
                grid-template-columns: repeat(2,1fr);
            }

            .about {
                grid-template-columns: 1fr;
            }

            .about-image {
                height: 450px;
            }

            .testimonials {
                grid-template-columns: 1fr;
            }

            .instagram-grid {
                grid-template-columns: repeat(3,1fr);
            }

            .footer-grid {
                grid-template-columns: repeat(2,1fr);
            }
        }

        @media(max-width: 600px) {

            .header-container {
                height: 65px;
            }

            .hero {
                min-height: 600px;
            }

            .hero h1 {
                font-size: 52px;
            }

            .hero p {
                font-size: 15px;
            }

            .section {
                padding: 65px 15px;
            }

            .section-header h2 {
                font-size: 30px;
            }

            .benefits-container {
                grid-template-columns: 1fr;
            }

            .categories {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .category {
                height: 250px;
            }

            .category-info {
                left: 15px;
                bottom: 15px;
            }

            .category-info h3 {
                font-size: 19px;
            }

            .products {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .product-image {
                height: 260px;
            }

            .product-info {
                padding: 14px;
            }

            .product-info h3 {
                font-size: 14px;
            }

            .product-description {
                font-size: 11px;
            }

            .price {
                font-size: 15px;
            }

            .buy-btn {
                padding: 8px 9px;
                font-size: 10px;
            }

            .banner {
                margin: 0 15px;
            }

            .banner-container {
                padding: 60px 25px;
            }

            .banner h2 {
                font-size: 34px;
            }

            .about-content h2 {
                font-size: 32px;
            }

            .instagram-grid {
                grid-template-columns: repeat(2,1fr);
            }

            .instagram-grid a {
                height: 180px;
            }

            .footer-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .footer-bottom {
                flex-direction: column;
            }
        }
    </style>
</head>
